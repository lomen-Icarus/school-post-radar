# CI + автодеплой на сервер Pterodactyl (panel.frienworld.space).
#
# Схема: push в main -> ruff + pytest -> перезапуск сервера через Client API панели.
# При старте сервер сам делает `git pull` и `pip install -r requirements.txt`
# (переменная AUTO_UPDATE=1 в яйце Python Generic), поэтому код доставляется без SFTP.
# Логика обращений к панели — deploy/ptero.py.
#
# Ручной запуск (Actions -> CI / Deploy -> Run workflow) принимает режим:
#   deploy    — перезапуск с git pull (как при push);
#   inspect   — только посмотреть сервер: состояние, переменные Startup, файлы;
#   bootstrap — прописать переменные Startup и залить код в пустой контейнер (git clone).
#
# Настройка репозитория (Settings -> Secrets and variables -> Actions):
#   secret   PTERODACTYL_API_KEY    — Client API key панели (ptlc_...), Account -> API Credentials
#   variable DEPLOY_BRANCH          — необязательно, ветка, которая уходит на сервер (по умолчанию main)
#   variable PTERODACTYL_PANEL_URL  — необязательно, по умолчанию https://panel.frienworld.space
#   variable PTERODACTYL_SERVER_ID  — необязательно, по умолчанию 75511c5e
name: CI / Deploy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy | inspect | bootstrap"
        type: choice
        options: [deploy, inspect, bootstrap]
        default: deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check radar tests deploy
      - name: Pytest
        run: pytest -q

  deploy:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Деплои не идут параллельно; новый push дожидается окончания предыдущего, а не обрывает его.
    concurrency:
      group: deploy-pterodactyl
      cancel-in-progress: false
    environment: production
    env:
      PANEL_URL: ${{ vars.PTERODACTYL_PANEL_URL || 'https://panel.frienworld.space' }}
      SERVER_ID: ${{ vars.PTERODACTYL_SERVER_ID || '75511c5e' }}
      API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
      MODE: ${{ inputs.mode || 'deploy' }}
    steps:
      - uses: actions/checkout@v6
      - name: Pterodactyl (${{ env.MODE }})
        run: python3 deploy/ptero.py "$MODE"
