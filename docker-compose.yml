services:
  radar:
    build: .
    container_name: school-post-radar
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/radar.sqlite
      REGISTRY_SEED_PATH: /app/data/registry_seed.sqlite
    volumes:
      - radar-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  radar-data:
